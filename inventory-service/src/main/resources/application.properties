spring.application.name=inventory-service

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shopwave_inventory}
spring.datasource.username=${DB_USER:shopwave}
spring.datasource.password=${DB_PASSWORD:shopwave}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${SERVER_PORT:8081}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.com.shopwave.inventory=INFO

# LAB-6 — Chaos (reserve endpoint)
shopwave.chaos.enabled=${CHAOS_ENABLED:false}
shopwave.chaos.delay-ms=${CHAOS_DELAY_MS:0}
shopwave.chaos.fail-rate=${CHAOS_FAIL_RATE:0}
